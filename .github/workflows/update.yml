name: Update now playing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'config.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and parse Last.fm RSS
        run: |
          python - <<'PY'
          import email.utils
          import html
          import json
          import re
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from pathlib import Path

          config = json.loads(Path('config.json').read_text(encoding='utf-8'))
          feed_url = config['feed_url']
          window_minutes = int(config.get('likely_playing_window_minutes', 15))

          def text_of(node, name):
              if node is None:
                  return ''
              for child in node:
                  if child.tag.split('}')[-1].lower() == name.lower():
                      return (child.text or '').strip()
              return ''

          def clean_html(value):
              value = re.sub(r'<[^>]+>', ' ', value or '')
              return re.sub(r'\s+', ' ', html.unescape(value)).strip()

          def split_title(value):
              for sep in (' – ', ' — ', ' - '):
                  if sep in value:
                      artist, track = value.split(sep, 1)
                      return artist.strip(), track.strip()
              return '', value.strip()

          result = {
              'status': 'error',
              'user': config.get('lastfm_user', ''),
              'source': feed_url,
              'updated_at': datetime.now(timezone.utc).isoformat(),
              'is_playing': False,
              'track': '',
              'artist': '',
              'album': '',
              'image': '',
              'url': '',
              'published': '',
              'raw_title': ''
          }

          try:
              request = urllib.request.Request(
                  feed_url,
                  headers={
                      'User-Agent': 'yy675908-lastfm-now-playing/1.0',
                      'Accept': 'application/rss+xml, application/xml, text/xml, */*'
                  }
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = response.read()

              root = ET.fromstring(payload)
              item = next((node for node in root.iter() if node.tag.split('}')[-1].lower() == 'item'), None)
              if item is None:
                  raise RuntimeError('RSS feed contains no track item')

              raw_title = text_of(item, 'title')
              artist, track = split_title(raw_title)
              description = clean_html(text_of(item, 'description'))
              album = text_of(item, 'album')
              if not album:
                  match = re.search(r'(?:album|from)\s*[:：]?\s*(.+)', description, flags=re.I)
                  if match:
                      album = match.group(1).strip()

              image = ''
              for child in item:
                  local = child.tag.split('}')[-1].lower()
                  if local == 'enclosure' and child.attrib.get('url'):
                      image = child.attrib['url'].strip()
                      break
                  if local in {'thumbnail', 'content'} and child.attrib.get('url'):
                      image = child.attrib['url'].strip()

              published = text_of(item, 'pubDate') or text_of(item, 'date') or text_of(item, 'updated')
              is_playing = False
              if published:
                  try:
                      dt = email.utils.parsedate_to_datetime(published)
                      if dt.tzinfo is None:
                          dt = dt.replace(tzinfo=timezone.utc)
                      age_seconds = (datetime.now(timezone.utc) - dt.astimezone(timezone.utc)).total_seconds()
                      is_playing = -120 <= age_seconds <= window_minutes * 60
                  except Exception:
                      pass

              result.update({
                  'status': 'ok',
                  'is_playing': is_playing,
                  'track': track,
                  'artist': artist,
                  'album': album,
                  'image': image,
                  'url': text_of(item, 'link'),
                  'published': published,
                  'raw_title': raw_title,
                  'description': description
              })
          except Exception as exc:
              result['error'] = f'{type(exc).__name__}: {exc}'

          Path('now-playing.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add now-playing.json
          git diff --cached --quiet || git commit -m 'Update now playing'
          git push
