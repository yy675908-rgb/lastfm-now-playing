name: Update now playing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'fetch_now_playing.py'
      - 'config.json'
      - 'trigger.txt'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: now-playing-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current Last.fm track
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python fetch_now_playing.py

      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add now-playing.json
          git diff --cached --quiet || git commit -m 'Update now playing'
          git push
